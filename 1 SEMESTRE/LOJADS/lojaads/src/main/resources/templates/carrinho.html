<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Meu Carrinho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
 
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/home">Loja Spring</a>
        <ul class="navbar-nav ms-auto align-items-center">
            <!-- Carrinho com ícone e texto -->
            <li class="nav-item me-3">
                <a class="nav-link d-flex align-items-center" th:href="@{/carrinho}">
                    <i class="bi bi-cart me-1" style="font-size: 1.3rem;"></i> Carrinho
                </a>
            </li>
 
            <!-- Usuário com ícone e nome -->
            <li class="nav-item d-flex align-items-center">
                <i class="bi bi-person-fill me-1" style="font-size: 1.3rem; color: white;"></i>
                <span class="navbar-text text-white" th:text="${nomeUsuario}">Usuário</span>
            </li>
        </ul>
    </div>
</nav>
 
<div class="container mt-4">
    <h2>Meu Carrinho</h2>
 
    <div th:if="${pedido != null and pedido.itens != null and #lists.size(pedido.itens) > 0}">
        <table class="table table-striped mt-3">
            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Quantidade</th>
                    <th>Preço Unitário</th>
                    <th>Subtotal</th>
                    <th></th>
                </tr>
            </thead>
            <tbody th:each="item : ${pedido.itens}">
                <tr>
                    <td th:text="${item.produto.nome}"></td>
                    <td th:text="${item.quantidade}"></td>
                    <td>R$ <span th:text="${item.produto.preco}"></span></td>
                    <td>R$ <span th:text="${item.subtotal}"></span></td>
                    <td>
                        <a th:href="@{/carrinho/remover/{id}(id=${item.idItem})}" class="btn btn-danger btn-sm">Remover</a>
                    </td>
                </tr>
            </tbody>
        </table>
        <div class="text-end mt-3">
            <h4>Total: R$ <span th:text="${pedido.total}"></span></h4>
        </div>
    </div>
 
    <div th:if="${pedido == null or pedido.itens == null or #lists.size(pedido.itens) == 0}">
        <p>Seu carrinho está vazio.</p>
        <a href="/home" class="btn btn-primary mt-3">Voltar para produtos</a>
    </div>
</div>
 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
