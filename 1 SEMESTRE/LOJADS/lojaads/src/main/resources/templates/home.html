<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
 
<head>
  <meta charset="UTF-8">
  <title>Loja Spring - Produtos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
 
</head>
 
<body>
 
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Loja Spring</a>
<ul class="navbar-nav ms-auto align-items-center">
    <!-- Carrinho com ícone e texto -->
    <li class="nav-item me-3">
        <a class="nav-link d-flex align-items-center" th:href="@{/carrinho}">
            <i class="bi bi-cart me-1" style="font-size: 1.3rem;"></i> Carrinho
        </a>
    </li>
 
    <!-- Usuário -->
    <li class="nav-item d-flex align-items-center">
        <i class="bi bi-person-fill me-1" style="font-size: 1.3rem; color: white;"></i>
        <span class="navbar-text text-white" th:text="${nomeUsuario}">Usuário</span>
    </li>
 
    <!-- Botão de logout -->
    <li class="nav-item d-flex align-items-center ms-3">
        <a th:href="@{/logout}" class="text-white" style="text-decoration: none;">
            <i class="bi bi-box-arrow-right" style="font-size: 1.3rem;"></i>
        </a>
    </li>
 
</ul>
 
    </div>
  </nav>
 
 
  <div class="container mt-4">
    <h2 class="mb-4">Produtos disponíveis</h2>
    <div class="row">
      <div class="col-sm-6 col-md-4 col-lg-3 mb-4" th:each="produto : ${produtos}">
        <div class="card shadow-sm h-100">
          <img th:src="${produto.imagem}" class="card-img-top" alt="Imagem do produto" />
          <div class="card-body d-flex flex-column h-100">
            <h5 th:text="${produto.nome}" class="card-title"></h5>
            <p th:text="${produto.descricao}" class="card-text flex-grow-1"></p>
            <p><strong>R$ <span th:text="${produto.preco}"></span></strong></p>
            <form th:action="@{/carrinho/adicionar}" method="post" class="mt-auto">
              <input type="hidden" th:name="idProduto" th:value="${produto.idProduto}" />
              <div class="input-group mb-3">
                <button type="button" class="btn btn-outline-secondary"
                  onclick="var res = this.nextElementSibling; if(res.value > 1) res.value--;">-</button>
                <input type="number" class="form-control text-center" name="quantidade" value="1" min="1" />
                <button type="button" class="btn btn-outline-secondary"
                  onclick="var res = this.previousElementSibling; res.value++;">+</button>
              </div>
              <button type="submit" class="btn btn-success w-100" onclick="showConfirmModal(event)">Adicionar ao
                carrinho</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
 
  <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="confirmModalLabel">Produto Adicionado</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          Produto adicionado ao carrinho com sucesso!
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Continuar Comprando</button>
          <a href="/carrinho" class="btn btn-primary">Ir para o Carrinho</a>
        </div>
      </div>
    </div>
  </div>
 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
 
  <script>
    function showConfirmModal(event) {
      event.preventDefault();
      var form = event.target.form;
 
      fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
      })
        .then(response => {
          if (response.ok) {
            var modal = new bootstrap.Modal(document.getElementById('confirmModal'));
            modal.show();
          } else {
            alert('Erro ao adicionar produto.');
          }
        })
        .catch(() => alert('Erro ao conectar ao servidor.'));
    }
  </script>
</body>
 
</html>
